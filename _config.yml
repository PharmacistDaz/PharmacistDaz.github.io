###########################################################
### Welcome to Beautiful Jekyll!
### This config file is meant for settings that affect your entire website. When you first
### set up your website you should go through all these settings and edit them, but after
### the initial set up you won't need to come back to this file often.
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: PharmacistDaz - Health, Thoughts & Ideas
# Your name to show in the footer
author: Pharmacist Daz

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  Home: ""
  About Me: "aboutme"

################
# --- Logo --- #
################

avatar: "/assets/img/avatar-logo.svg"
round-avatar: true

#####################################
# --- Footer social media links --- #
#####################################

social-network-links:
  rss: true
  linkedin: digital-pharma-darren
  twitter: pharmacistdaz

rss-description: Thoughts on health, pharmacy and ideas from Pharmacist Daz

###########################
# --- General options --- #
###########################

share-links-active:
  twitter: true
  facebook: false
  linkedin: true
  vk: false
  reddit: false

url-pretty: "pharmacistdaz.github.io"

readtime: true
title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: true
navbar-var-length: false

######################################
# --- Colours / background image --- #
######################################

page-col: "#f7f6f1"
text-col: "#253b37"
link-col: "#176b63"
hover-col: "#b55b3d"
navbar-col: "#fffdf8"
navbar-text-col: "#253b37"
navbar-border-col: "#e5e2d9"
footer-col: "#203a36"
footer-text-col: "#d7e2dc"
footer-link-col: "#fffdf8"
footer-hover-col: "#f1bd76"

#################################
# --- Web Analytics Section --- #
#################################

#gtag: "G-XXXXXXXXXX"

####################
# --- Comments --- #
####################

#disqus: ""

################
# --- Misc --- #
################

date_format: "%B %-d, %Y"

#################################################################################
# --- You don't need to touch anything below here (but you can if you want) --- #
#################################################################################

timezone: "Europe/London"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-paginate
  - jekyll-sitemap

